[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "clipmatch"
version = "0.1.0"
description = "Resumable manual vertical clips from selected VOD windows"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6", "yt-dlp>=2025.1.15"]

[project.optional-dependencies]
# faster-whisper's audio reader uses av.open(metadata_errors=...), removed in PyAV 19.
transcription = ["faster-whisper>=1.1", "av<19"]
live = ["aiohttp>=3.10,<4", "python-dotenv>=1,<2"]

[project.scripts]
clipmatch = "clipmatch.cli:main"
clipmatch-live = "clipmatch.live:main"

[tool.setuptools.packages.find]
include = ["clipmatch*"]

[tool.setuptools.package-data]
clipmatch = ["layouts.json"]
